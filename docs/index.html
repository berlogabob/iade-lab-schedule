<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filters · IADE Schedule</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1><a href="./">IADE Schedule</a></h1>
<nav><span id="views"><button type="button" data-view="list">List</button><button type="button" data-view="day">Day</button><button type="button" data-view="week">Week</button><button type="button" data-view="month">Month</button></span><span id="ranges"><button type="button" data-range="today">Today</button><button type="button" data-range="week">This week</button><button type="button" data-range="all">All dates</button></span><span id="period" hidden><button type="button" id="prev" aria-label="Previous">‹</button><button type="button" id="now">Today</button><button type="button" id="next" aria-label="Next">›</button><span id="period-label"></span></span></nav>
</header>
<details id="filters-box" open>
<summary><span id="summary-text">Filters</span><span id="favs"><span id="fav-list"></span><button type="button" id="fav-save">☆ Save as favourite</button></span></summary>
<form id="filters" data-default-room="Lab. e Estudo de Jogos - Tech Lab (Oriente)">
<label>Degree <span class="box"><input name="degree" list="degree-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Degree">×</button></span></label><datalist id="degree-list"></datalist>
<label>Programme <span class="box"><input name="programme" list="programme-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Programme">×</button></span></label><datalist id="programme-list"></datalist>
<label>Room / lab <span class="box"><input name="room" list="room-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Room / lab">×</button></span></label><datalist id="room-list"></datalist>
<label>Professor <span class="box"><input name="teacher" list="teacher-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Professor">×</button></span></label><datalist id="teacher-list"></datalist>
<label>Group <span class="box"><input name="group" list="group-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Group">×</button></span></label><datalist id="group-list"></datalist>
<label>Course <span class="box"><input name="course" list="course-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Course">×</button></span></label><datalist id="course-list"></datalist>
<label>Type <span class="box"><input name="type" list="type-list" placeholder="any" autocomplete="off"><button type="button" class="clear" aria-label="Clear Type">×</button></span></label><datalist id="type-list"></datalist>
<label class="date-field">From <input name="from" type="date"></label>
<label class="date-field">To <input name="to" type="date"></label>
</form>
</details>
<noscript><p class="empty">Filters need JavaScript. Use Today, This week or All instead.</p></noscript>
<script type="module" src="filter.js"></script>
<main>
<p class="empty">Loading…</p>
</main>
<footer>
<p>Data last changed: 2026-09-18 05:42</p>
<p>Lab pages: <a href="today.html">today</a> · <a href="week.html">this week</a> · <a href="all.html">all</a> · <a href="calendar/lab.ics">calendar (.ics)</a> · <a href="https://horariosturmas.europeia.pt/UE_IADE/HorariosTurmas/">official IADE timetable</a></p>
<p>Unofficial timetable view. Always verify critical scheduling information with the official IADE timetable.</p>
</footer>
</body>
</html>
